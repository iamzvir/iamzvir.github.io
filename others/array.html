<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <script>
    
    let numbers = [42, 56, 96, 14, 28];

    // Угадай число

    {
      alert('Запомните числа и их порядок: ' + numbers);

      let userAnswer = +prompt('Каким было первое число');

      if (userAnswer == numbers[0]) {
        alert('Все верно!');
      } else {
        alert('А вот и нет. Правильный ответ ' + numbers[0]);
      }


      userAnswer = +prompt('А последнее число какое?');

      if (userAnswer == numbers[numbers.length - 1]) {
        alert('Опять все верно!')
      } else {
        alert('Не угадал. Правильный ответ ' + numbers[numbers.length - 1]); // numbers.length - 1 (что бы не было ошибки, так как в массиве нет 5го элемента (он есть но под номером 4, так как счет идет от 0) и цифра 5 будет выдавать undefined)
      }
    }


    // сгененрировать случайное число от 1 до 4 и потом попросить пользователя вспомнить это число (например: вспомните третье число)

    {

      let n = parseInt(Math.random() * numbers.length); // numbers.length - это цифра 5 (5 элеменов массива)
      
      let userAnswer = +prompt('А как на счет числа под номером ' + (n + 1) + '?'); // (n + 1) - исключаем 0
      
      if (userAnswer == numbers[n]) {
        alert('Красавчик');
      } else {
        alert('Хуй там ночевал, правильный ответ -  ' + numbers[n]);
      }
      

    }



  </script>


</body>

</html>
