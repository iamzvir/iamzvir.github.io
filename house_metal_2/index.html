<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Твій Дім+ | Модульні будинки</title>
  <!-- Подключаем шрифт Manrope или Montserrat для схожести -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Шапка (Header) -->
  <header class="header">
    <div class="container header-row">

      <!-- Логотип -->
     <a href="#" class="logo">
        <svg width="200" height="35" viewBox="0 0 220 50" fill="none">
         
          <path d="M4 46 L54 43 L54 18 L29 4 L6 18 L9 36" stroke="#2D3440" stroke-width="3" stroke-linecap="round"
            stroke-linejoin="round" fill="none" />

          <path d="M19 24 L29 17 L39 24 V35 H19 V24 Z" fill="#F2C94C" />

          <text x="75" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#2D3440"
            letter-spacing="0.5">ТВІЙ ДІМ</text>

          <path d="M198 28 H212 M205 21 V35" stroke="#F2C94C" stroke-width="2" stroke-linecap="square" />
        </svg>
      </a>

      <!-- Навигация -->
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="#">Наші будинки</a></li>
          <li><a href="#">Моделі</a></li>
          <li><a href="#">Як це працює</a></li>
          <li><a href="#">Галерея</a></li>
          <li><a href="#">Ціни</a></li>
          <li><a href="#">Контакти</a></li>
        </ul>
      </nav>

      <!-- Кнопка в шапке -->
      <a href="#" class="btn btn-header">Замовити консультацію</a>

      <!-- Бургер меню (для мобильных) -->
      <div class="burger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <!-- Hero Section (Первый экран) -->
  <section class="hero">
    <!-- Место под фоновое изображение -->
    <div class="hero-bg-placeholder"></div>

    <div class="container hero-content">
      <h1 class="hero-title">
        Твій дім — <br>
        без років <br>
        очікування
      </h1>
      <p class="hero-subtitle">
        Купуйте модульні будинки швидко, якісно та комфортно.
        Сучасні рішення для вашого життя.
      </p>

      <div class="hero-buttons">
        <a href="#" class="btn btn-primary">Обрати модель</a>
        <a href="#" class="btn btn-glass">Розрахувати вартість</a>
      </div>
    </div>
  </section>

</body>


</html>
