<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Твій Дім+ | Модульні будинки</title>
  <!-- Подключаем шрифт Manrope или Montserrat для схожести -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Шапка (Header) -->
  <header class="header">
    <div class="container header-row">

      <!-- Логотип -->
      <a href="#" class="logo">
        <svg width="140" height="30" viewBox="0 0 230 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Группа иконки -->
          <g id="icon-house">
            <!-- 
                   Контур домика:
                   1. Начинаем слева снизу (но не с самого угла, оставляем разрыв).
                   2. Идем вверх.
                   3. Крыша домиком.
                   4. Вниз по правой стене.
                   5. Влево по низу (замыкаем угол справа, но не доходим до левого края).
                   Используем stroke-linejoin="round" для мягких углов.
                -->
            <path d="M6 32 V 18 L 25 5 L 44 18 V 42 H 14" stroke="#2D3440" stroke-width="5" stroke-linecap="round"
              stroke-linejoin="round" />

            <!-- Желтое окно (Мягкий квадрат) -->
            <!-- Немного смещено, как на оригинале -->
            <rect x="16" y="20" width="14" height="14" rx="2" fill="#F2C94C" />
          </g>

          <!-- Текст -->
          <!-- Используем шрифт, максимально похожий на оригинал (гротеск) -->
          <text x="58" y="34" font-family="'Manrope', 'Montserrat', 'Verdana', sans-serif" font-size="24"
            font-weight="600" fill="#2D3440" letter-spacing="0.9">ТВІЙ ДІМ</text>

          <!-- Плюсик (Акцентный цвет) -->
          <text x="170" y="34" font-family="'Manrope', 'Montserrat', 'Verdana', sans-serif" font-size="26"
            font-weight="600" fill="#F2C94C">+</text>
        </svg>
      </a>

      <!-- Навигация -->
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="#">Наші будинки</a></li>
          <li><a href="#">Моделі</a></li>
          <li><a href="#">Як це працює</a></li>
          <li><a href="#">Галерея</a></li>
          <li class="has-dropdown">Ціни</li>
          <li><a href="#">Контакти</a></li>
        </ul>
      </nav>

      <!-- Кнопка в шапке -->
      <a href="#" class="btn btn-header">Замовити консультацію</a>

      <!-- Бургер меню (для мобильных) -->
      <div class="burger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <!-- Hero Section (Первый экран) -->
  <section class="hero">
    <!-- Место под фоновое изображение -->
    <div class="hero-bg-placeholder"></div>

    <div class="container hero-content">
      <h1 class="hero-title">
        Твій дім — <br>
        без років <br>
        очікування
      </h1>
      <p class="hero-subtitle">
        Купуйте модульні будинки швидко, якісно та комфортно.
        Сучасні рішення для вашого життя.
      </p>

      <div class="hero-buttons">
        <a href="#" class="btn btn-primary">Обрати модель</a>
        <a href="#" class="btn btn-glass">Розрахувати вартість</a>
      </div>
    </div>
  </section>

</body>

</html>
