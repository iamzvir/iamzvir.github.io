<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharada_Shand</title>
</head>

<body>

  <meta charset="utf-8">

  <button onclick="startGame()">Начать игру</button>

  <script>
    function startGame() {

      alert('Загадка №1');
      let userRiddle1 = prompt('Зимой и летом одним цветом?');
      let correctAnswer1 = ['елка', 'ель', 'ёлка'];

      let sumCorrectAnswers = 0;

      if (correctAnswer1.includes(userRiddle1?.toLowerCase())) {
        alert('Поздравляю это верный ответ!');
        sumCorrectAnswers++;
      } else {
        alert('Увы, но вы не угадали');
      }

      alert('Переходим к загадке №2');
      let userRiddle2 = +prompt('7 * 9 = ?');

      if (userRiddle2 == 63) {
        alert('Поздравляю! ты знаешь табличку умножения, надеюсь ;)');
        sumCorrectAnswers++;
      } else {
        alert('Нет, ответ не верный.');
      }

      alert('Игра окончена!');
      alert('Количество правильных ответов: ' + sumCorrectAnswers);
    }
  </script>



</body>

</html>
