<!DOCTYPE html>
<html lang="ru">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Личный сайт студента GeekBrains</title>
   <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

   <header class="header">
      <nav class="nav">
         <a href="index.html" class="nav-link">Главная</a>
         <a href="#" class="nav-link">Загадки</a>
         <a href="#" class="nav-link">Угадайка</a>
      </nav>
   </header>

   <main class="main">
      <div class="container">
         <h1 class="title">Игра в загадки</h1>

         <div class="box">
            <p>Что можно увидеть с закрытими глазами?</p>
            <input type="text" id="userAnswer1">

            <p>Какой болезнью никто не болеет на суше?</p>
            <input type="text" id="userAnswer2">

            <p>Какой конь не ест овса?</p>
            <input type="text" id="userAnswer3">

            <br>
            <a href="#" onclick="checkAnswers();">Ответить</a>
         </div>
      </div>
   </main>

   <footer class="footer">
      <p>&copy; 2023 Юрий Милославский. Все права защищены.</p>
   </footer>

   <!-- Первый вариант -->
   <script>

      let userAnswer = null;
      let score = 0;


      function checkAnswers() {
         userAnswer = document.getElementById('userAnswer1').value;
         userAnswer = userAnswer.toLowerCase();

         if (userAnswer == 'сон' || userAnswer == 'сновидение') {
            score++;
         }

         userAnswer = document.getElementById('userAnswer2').value;
         userAnswer = userAnswer.toLowerCase();

         if (userAnswer == 'морской' || userAnswer == 'укус акулы') {
            score++;
         }

         userAnswer = document.getElementById('userAnswer3').value;
         userAnswer = userAnswer.toLowerCase();

         if (userAnswer == 'шахматный' || userAnswer == 'мертвый') {
            score++;
         }

         alert('Вы отгадали ' + score + ' загадок');
      }


   </script>
</body>

</html>
