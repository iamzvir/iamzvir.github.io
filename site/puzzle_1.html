<!DOCTYPE html>
<html lang="ru">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

   <header class="header">
      <nav class="nav">
         <a href="index.html" class="nav-link">Главная</a>
         <a href="#" class="nav-link">Загадки</a>
         <a href="gues_1.html" class="nav-link">Угадайка</a>
      </nav>
   </header>

   <main class="main">
      <div class="container">
         <h1 class="title">Игра в загадки</h1>

         <div class="box">
            <p>Что можно увидеть с закрытими глазами?</p>
            <input type="text" id="userAnswer1">

            <p>Какой болезнью никто не болеет на суше?</p>
            <input type="text" id="userAnswer2">

            <p>Какой конь не ест овса?</p>
            <input type="text" id="userAnswer3">

            <br>
            <a href="#" onclick="checkAnswers();">Ответить</a>
         </div>
      </div>
   </main>

   <footer class="footer">
      <p>&copy; 2023 Юрий Милославский. Все права защищены.</p>
   </footer>

   <!-- Второй вариант -->
   <script>

      let userAnswer = null;
      let score = 0;

      function checkAnswer(inputId, answers) {
         userAnswer = document.getElementById(inputId).value;
         userAnswer = userAnswer.toLowerCase();
         
         for( let i = 0; i < answers.length; i++) {
            if(userAnswer == answers[i]) {
               score++;
               break;
            }
         }
      }
      
      function checkAnswers() {
         
         // 1й арг передается в параметр "inputId". 2й арг в виде МАССИВА передается в параметр "answers"
         
         checkAnswer('userAnswer1', ['сон', 'сновидение']); 
         checkAnswer('userAnswer2', ['морской', 'укус акулы']);
         checkAnswer('userAnswer3', ['шахматный', 'мертвый']);
         
         alert('Вы отгадали ' + score + ' загадок');
      }


   </script>
</body>

</html>
