   <main class="main">
      <div class="container">
         <h1 class="title">Игра угадайка</h1>

         <div class="box">

            <a href="#" onClick="gues();">Ответить</a>
         </div>
      </div>
   </main>

   <script>
      
      function gues() {
         let answer = parseInt(Math.random() * 100);
         let userAnswer = +prompt('Угадайте число от 1 до 100 #4');
         let tryCount;
         let maxTry = 2; // предоставляемое количество попыток для юзера


         for (tryCount = 0; tryCount < maxTry; tryCount++) {
            if (userAnswer === answer) {
               alert('Поздравляю, вы угадали! ');
               break;
            } else if (userAnswer > answer) {
               alert('Вы ввели слишком большое число ');
            } else if (userAnswer < answer) {
               alert('Вы ввели слишком маленькое число ');
            }

            userAnswer = +prompt('Поробуйте еще раз. Введите число от 1 до 100 #4\n У вас осталось ' + (maxTry - tryCount) + ' попыток'); // c)
         }

         if (tryCount === maxTry) {
            alert('Вы проиграли :(')
         }


         alert('Правильный ответ ' + answer);
      }

   </script>
