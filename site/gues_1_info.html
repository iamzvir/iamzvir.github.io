<!DOCTYPE html>
<html lang="ru">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Личный сайт студента GeekBrains</title>
   <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

   <header class="header">
      <nav class="nav">
         <a href="index.html" class="nav-link">Главная</a>
         <a href="puzzle_1.html" class="nav-link">Загадки</a>
         <a href="#" class="nav-link">Угадайка</a>
      </nav>
   </header>

   <main class="main">
      <div class="container">
         <h1 class="title">Игра угадайка</h1>

         <div class="box">

            <p id="info" class="info">Угадайте число от 1 до 10</p>
            <input id="userAnswer" type="text">

            <a href="#" onclick="gues();">Ответить</a>
         </div>
      </div>
   </main>

   <footer class="footer">
      <p>&copy; 2023 Юрий Милославский. Все права защищены.</p>
   </footer>


   <script>

      // генерирует случайное число для загадки
      let answer = parseInt(Math.random() * 10);


      // получение данных из инпута (заменяет бывший запрос в алерте)

      function readInt() {
         // number1 - это внутренняя переменная
         number1 = document.getElementById('userAnswer').value;

         // преобразование полученых данных из инпута, в числовой тип
         return parseInt(number1);

         // улучшенный способ записи в return - вместо верхних двух строк, можна записать вот так:
         // return +document.getElementById('userAnswer').value;
      }



      // изменение текста в параграфе на странице после того или иного ответа (информирование пользователя)

      function write(text) {
         document.getElementById('info').innerHTML = text; // замена текста на странице, тем что передастся в вызове ф-ции в качестве параметра.
      }

      
      
      function gues() {
         // меняется текст на сайте над полем ввода числа
         write('Всем привет!');
         
         // ф-ция readInt(); возвращает результат записанный number1 который передается во внутреннюю переменную number2
         number2 = readInt();
         
         // вывод содержимого внутренней переменной nnumber2 ф-ции gues(), которую вызывает юзер, нажатаием на кнопку на сайте
         console.log(number2);
      }

   </script>
</body>

</html>
