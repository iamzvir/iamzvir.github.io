<!DOCTYPE html>
<html lang="ru">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Личный сайт студента GeekBrains</title>
   <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

   <header class="header">
      <nav class="nav">
         <a href="index.html" class="nav-link">Главная</a>
         <a href="puzzle_1.html" class="nav-link">Загадки</a>
         <a href="#" class="nav-link">Угадайка</a>
      </nav>
   </header>

   <main class="main">
      <div class="container">
         <h1 class="title">Игра угадайка</h1>

         <div class="box">

            <p id="info">Угадайте число от 1 до 10</p>
            <input id="userAnswer" type="text">

            <a id="button" href="#" onclick="gues();">Ответить</a>
         </div>
      </div>
   </main>

   <footer class="footer">
      <p>&copy; 2023 Юрий Милославский. Все права защищены.</p>
   </footer>


   <script>

      // Шаг 1. Генерация случайного числа (от 1 до 10) для загадки
      let answer = parseInt(Math.random() * 10) + 1;

      // Шаг 2. Будет содержать количество уже совершенных попыток
      let tryCount = 0;

      // Шаг 2. Максимальное количество попыток для пользователя
      let maxTryCount = 3;


      // Шаг 1. передача данных из поля ввода на сайте, во внутреннюю переменную number1
      function readInt() {
         let number1 = document.getElementById('userAnswer').value;

         // преобразование и передача во внутреннюю переменную number1 полученых данных из поля ввода на сайте, в числовой тип
         return parseInt(number1);

         // улучшенный способ записи в return - вместо верхних двух строк, можна записать вот так:
         // return +document.getElementById('userAnswer').value;
      }



      // Шаг 1. изменение текста над полем ввода на сайте после того или иного ответа (информирование пользователя)
      function write(text) {
         document.getElementById('info').innerHTML = text; // замена текста на странице тем что вернет ф-ция gues();
      }

      
      // Шаг 3. Ф-ция которя скрывает любой елемент со страницы
      function hide(id) {
         document.getElementById(id).style.display = 'none';
      }
      

      // Шаг 1. ф-ция сравнит введенное значение из поля ввода на сайте с случайно сгенерированным число и вернет соответствующий результат.
      function gues() {

         // переменная принимет данные из поля ввода на сайте, которые возвращатся в виде переменной number1 при вызове ф - ции readInt().
         let userAnswer = readInt();
         tryCount++;
         if (userAnswer == answer) {
            write('<b>Поздравляю, вы угадали!</b>');
            hide('userAnswer');
            hide('button');
         } else if (tryCount >= maxTryCount) {
            write('Вы проиграли<br>Правильный ответ ' + answer);
            hide('userAnswer');
            hide('button');
         } else if (userAnswer > answer) {
            write('Вы ввели большее число <b>Полпробуйте ещё раз.</b>');
         } else if (userAnswer < answer) {
            write('Вы ввели меньшее число <b>Полпробуйте ещё раз.</b>');
         }

      }

   </script>
</body>

</html>
